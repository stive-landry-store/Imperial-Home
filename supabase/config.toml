# Imperial Home — Supabase CLI
# Link a hosted project: npx supabase login && npx supabase link --project-ref YOUR_REF
# Then apply schema: npx supabase db push

project_id = "imperial-home"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:5174",
  "http://localhost:5174/**",
  "http://127.0.0.1:5173/**",
  "http://127.0.0.1:5174/**",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[edge_runtime]
enabled = true
