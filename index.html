<!doctype html>
<html lang="fr" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ih-theme')
          document.documentElement.classList.remove('theme-dark', 'theme-light')
          document.documentElement.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark')
          var lang = localStorage.getItem('ih-lang')
          if (lang === 'en' || lang === 'fr') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/brand/imperial-monogram.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Imperial Home — furnished guest residences in Douala, Cameroon. Book premium apartments with verified availability."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Impérial Home | Résidences meublées à Douala</title>
    <style>
      html, body { margin: 0; }
      html.theme-dark, html.theme-dark body { background: #050505; color: #f4eee3; }
      html.theme-light, html.theme-light body { background: #f7f4ee; color: #14110c; }
      #ih-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #050505;
        overflow: hidden;
      }
      #ih-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(ellipse at 50% 42%, rgba(196, 163, 90, 0.14), transparent 55%);
        pointer-events: none;
      }
      #ih-boot .ih-boot-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }
      #ih-boot .ih-boot-frame {
        position: relative;
        width: min(42vw, 168px);
        overflow: visible;
      }
      #ih-boot img {
        display: block;
        width: 100%;
        height: auto;
        opacity: 0;
        transform: scale(0.86);
        filter: blur(10px) brightness(0.7);
      }
      #ih-boot.is-ready img {
        animation: ih-emerge 1.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #ih-boot .ih-boot-sheen {
        position: absolute;
        inset: -10%;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 236, 180, 0.38) 50%, transparent 62%);
        transform: translateX(-130%);
        pointer-events: none;
        mix-blend-mode: screen;
      }
      #ih-boot.is-ready .ih-boot-sheen {
        animation: ih-sheen 1.4s 1.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #ih-boot .ih-boot-word {
        margin-top: 28px;
        text-align: center;
        opacity: 0;
        color: #d4af6a;
        font-family: Cinzel, Georgia, serif;
        letter-spacing: 0.42em;
        font-size: 16px;
        text-transform: uppercase;
      }
      #ih-boot.is-ready .ih-boot-word {
        animation: ih-fade 1s 1.35s ease forwards;
      }
      #ih-boot .ih-boot-tag {
        margin-top: 10px;
        opacity: 0;
        color: rgba(212, 175, 106, 0.75);
        font-family: Montserrat, system-ui, sans-serif;
        letter-spacing: 0.28em;
        font-size: 12px;
        text-transform: uppercase;
      }
      #ih-boot.is-ready .ih-boot-tag {
        animation: ih-fade 1s 1.7s ease forwards;
      }
      #ih-boot .ih-boot-line {
        margin-top: 28px;
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d4af6a, transparent);
      }
      #ih-boot.is-ready .ih-boot-line {
        animation: ih-line 1.1s 1.85s ease forwards;
      }
      #ih-boot.is-leaving {
        animation: ih-exit 1.05s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        pointer-events: none;
      }
      #ih-boot.is-leaving .ih-boot-inner {
        animation: ih-sink 1.05s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes ih-emerge {
        to { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); }
      }
      @keyframes ih-sheen {
        to { transform: translateX(130%); }
      }
      @keyframes ih-fade {
        to { opacity: 1; }
      }
      @keyframes ih-line {
        to { width: min(42vw, 180px); }
      }
      @keyframes ih-exit {
        0% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
      @keyframes ih-sink {
        to { transform: scale(1.06); filter: blur(8px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ih-boot img, #ih-boot .ih-boot-word, #ih-boot .ih-boot-tag { opacity: 1; transform: none; filter: none; animation: none; }
        #ih-boot .ih-boot-sheen { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="ih-boot" aria-hidden="true">
      <div class="ih-boot-inner">
        <div class="ih-boot-frame">
          <img src="/brand/imperial-monogram.png" alt="" width="168" height="232" fetchpriority="high" />
          <span class="ih-boot-sheen"></span>
        </div>
        <p class="ih-boot-word">Impérial Home</p>
        <p class="ih-boot-tag">L'art du soin. L'esprit du détail.</p>
        <span class="ih-boot-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var el = document.getElementById('ih-boot')
        if (!el) return
        el.classList.add('is-leaving')
        window.setTimeout(function () { el.remove() }, 1200)
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
